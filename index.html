<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DCM</title>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('app_active_theme') || 'dark';
          if (savedTheme !== 'dark' && savedTheme !== 'light' && savedTheme !== 'eyecare') {
            savedTheme = 'dark';
          }
          document.documentElement.setAttribute('data-theme', savedTheme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#1e2128] text-gray-200 m-0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
